<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<main class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-muted small mb-1">АльпКлуб</div>
            <h1 class="h4 mb-3">
                Ошибка <span th:text="${status}">500</span>
            </h1>
            <p class="text-muted" th:text="${error}">Внутренняя ошибка</p>
            <p th:if="${message}" th:text="${message}"></p>
            <a class="btn btn-dark" th:href="@{/}">На главную</a>
        </div>
    </div>
</main>
</body>
</html>
