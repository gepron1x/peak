<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
<main class="container" style="max-width: 420px;">
    <div class="text-center mb-4">
        <div class="h2 fw-semibold mb-1">АльпКлуб</div>
        <div class="text-muted">Учет восхождений</div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h5 mb-3">Вход в систему</h1>

            <div class="alert alert-success py-2" th:if="${param.logout}">Вы вышли из системы</div>
            <div class="alert alert-danger py-2" th:if="${param.error}">Неверный логин или пароль</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input class="form-control" type="text" id="username" name="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <button class="btn btn-dark w-100" type="submit">Войти</button>
            </form>
        </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">Доступ по учетной записи оператора клуба</p>
</main>
</body>
</html>
