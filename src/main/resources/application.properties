spring.application.name=peak
spring.config.import=optional:file:.env[.properties]

# HTTP
server.port=${SERVER_PORT:8088}

# PostgreSQL datasource (values loaded from .env file)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Date and time formats (ISO in storage and form binding)
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
spring.mvc.format.time=iso

# Единственная учетная запись оператора клуба (пароль задается окружением)
app.security.username=${APP_USERNAME:operator}
app.security.password=${APP_PASSWORD}

# Контрольный набор данных из ТЗ; наполняет только пустую базу
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
