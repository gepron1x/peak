name: peak

services:
  db:
    image: postgres:18-alpine
    container_name: peak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: peak
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peak-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/peak
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_USERNAME: ${APP_USERNAME:-operator}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set in .env}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      SERVER_PORT: 8088
    ports:
      - "${APP_PORT:-8088}:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
